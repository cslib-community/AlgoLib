name: Build Lean project

on:
  push:
    branches: [main, experimental-RAM-model]
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  style_lint:
    name: Lint style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check RAM abstraction boundaries
        run: python3 AlgoLib/Experimental/RAM/Tests/check_layers.py

      - name: Don't 'import Mathlib', use precise imports
        if: always()
        run: |
          ! (find AlgoLib -name "*.lean" -type f -print0 | xargs -0 grep -E -n '^import Mathlib$')

  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint the project
        id: build-lean
        uses: leanprover/lean-action@f807b338d95de7813c5c50d018f1c23c9b93b4ec # v1.2.0

      - name: Check RAM elaboration budgets
        run: python3 AlgoLib/Experimental/RAM/Tests/check_elaboration.py --output "$RUNNER_TEMP/ram-elaboration"

      - name: Preserve RAM elaboration profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ram-elaboration
          path: ${{ runner.temp }}/ram-elaboration/
          if-no-files-found: ignore

      - name: File dependencies
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt install graphviz -y
          ~/.elan/bin/lake exe graph website/file_deps.pdf

      - name: Build project documentation
        if: github.ref == 'refs/heads/main'
        id: build-docgen
        uses: leanprover-community/docgen-action@main
        with:
          blueprint: true
          homepage: "website"
          # website/ is plain static HTML, not a Jekyll site. The action still copies
          # the API docs and blueprint into website/, then uploads that folder directly.
          build-page: false