name: Build Lean project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  style_lint:
    name: Lint style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Don't 'import Mathlib', use precise imports
        if: always()
        run: |
          ! (find AlgoLib -name "*.lean" -type f -print0 | xargs -0 grep -E -n '^(public )?(meta )?import Mathlib$')

      - name: Test the release readiness checker
        run: node --test .github/scripts/check-lean-release.test.cjs

  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint the project
        id: build-lean
        uses: leanprover/lean-action@f807b338d95de7813c5c50d018f1c23c9b93b4ec # v1.2.0

      - name: Check public imports and declaration checker
        run: |
          lake env lean tests/Import.lean
          lake build checkdecls

      - name: File dependencies
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt install graphviz -y
          ~/.elan/bin/lake exe graph website/file_deps.pdf

      - name: Build project documentation
        if: github.ref == 'refs/heads/main'
        id: build-docgen
        uses: leanprover-community/docgen-action@main
        with:
          blueprint: true
          homepage: "website"
          # website/ is plain static HTML, not a Jekyll site. The action still copies
          # the API docs and blueprint into website/, then uploads that folder directly.
          build-page: false

  release:
    name: Release tested Lean version
    needs: [style_lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: lean-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish a new stable version once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(cat lean-toolchain)
          if [[ ! "$toolchain" =~ ^leanprover/lean4:(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Skipping non-stable toolchain: $toolchain"
            exit 0
          fi
          tag="${BASH_REMATCH[1]}"
          existing=$(git ls-remote --tags origin "refs/tags/$tag")
          if [[ -n "$existing" ]]; then
            echo "Keeping existing tag $tag unchanged."
            exit 0
          fi
          # Tag the commit that passed this run, including all upgrade fixes.
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "AlgoLib for Lean $tag" --generate-notes
