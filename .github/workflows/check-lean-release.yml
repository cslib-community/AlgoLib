name: Check stable Lean releases

on:
  schedule:
    - cron: '37 5 * * *' # Daily at 05:37 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-stable-lean-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check upstream releases and report readiness
        uses: actions/github-script@v9
        with:
          script: |
            const check = require('./.github/scripts/check-lean-release.cjs');
            await check({ github, context, core });
