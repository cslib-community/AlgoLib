name = "AlgoLib"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AlgoLib"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3


[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.35.0"

[[require]]
name = "checkdecls"
scope = "PatrickMassot"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "AlgoLib"
requiresModuleSystem = true
