name = "AlgoLib"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AlgoLib"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3


[[require]]
name = "cslib"
scope = "leanprover"

[[require]]
name = "checkdecls"
scope = "PatrickMassot"
rev = "master"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc2"

[[lean_lib]]
name = "AlgoLib"

# Pinned, locally ported upstream frameworks; see vendor/README.md.
[[require]]
name = "Loom"
path = "vendor/loom"

[[require]]
name = "Velvet"
path = "vendor/velvet"
